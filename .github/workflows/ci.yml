name: CI

# Runs on every push and PR; release.yml calls it before building a release.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  node:
    name: TS (console, desk UI, plugins, schemas, tools, hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Type-check
        run: pnpm run typecheck
      - name: Unit tests (workspaces)
        run: pnpm -r --if-present run test
      - name: Hook tests
        run: pnpm run test:hooks
      - name: Release tooling tests
        run: pnpm run test:tools
      - name: Skills lock matches disk
        run: node tools/release/cli.mjs verify-skills
      - name: Build console
        run: pnpm --filter @offmanual/console run build
      - name: Build desk UI
        run: pnpm --filter @offmanual/desk run build:ui

  go:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server-agent/go.mod
          cache-dependency-path: |
            apps/server-agent/go.sum
            tools/sign-manifest/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l apps/server-agent tools/sign-manifest)" || { gofmt -l apps/server-agent tools/sign-manifest; exit 1; }
      - name: go vet
        run: go vet ./apps/server-agent/... ./tools/sign-manifest/...
      - name: go test
        run: go test -count=1 -cover ./apps/server-agent/... ./tools/sign-manifest/...
      - name: go test -race (linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./apps/server-agent/... ./tools/sign-manifest/...
      - name: golangci-lint
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: apps/server-agent
      - name: golangci-lint (sign-manifest)
        if: runner.os == 'Linux'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: tools/sign-manifest
      - name: actionlint (workflows)
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Build server-agent.exe
        if: runner.os == 'Windows'
        run: go build -trimpath -o dist/server-agent.exe ./apps/server-agent/cmd/server-agent && ./dist/server-agent.exe version
      - name: Service round trip (install as LocalSystem, call over the pipe, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist\server-agent.exe'
          $data = Join-Path $env:RUNNER_TEMP 'om-data'
          & $exe install -data $data
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-Service OffManualAgent).Status -ne 'Running' -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            if ((Get-Service OffManualAgent).Status -ne 'Running') { throw "service not running" }
            # ADR-062: SCM must also restart the agent when it stops itself with an error
            # (that is how it restarts into a new release).
            $flag = (sc.exe qfailureflag OffManualAgent) -join "`n"
            if ($flag -notmatch 'FAILURE_ACTIONS_ON_NONCRASH_FAILURES\s*:\s*TRUE') { throw "non-crash recovery flag not set: $flag" }
            # ADR-029/034: a standard GENERIC_READ|GENERIC_WRITE client must be refused, because
            # GENERIC_WRITE includes FILE_CREATE_PIPE_INSTANCE (squatting). Even an admin is refused.
            $std = New-Object System.IO.Pipes.NamedPipeClientStream('.', 'offmanual-agent', [System.IO.Pipes.PipeDirection]::InOut)
            $refused = $false
            try { $std.Connect(5000) } catch [System.UnauthorizedAccessException] { $refused = $true } finally { $std.Dispose() }
            if (-not $refused) { throw "a GENERIC_WRITE client was allowed to connect" }
            # The supported path: bridge (read + write-data only, checks the server is LocalSystem).
            $requests = @(
              '{"jsonrpc":"2.0","id":1,"method":"session.hello","params":{}}',
              '{"jsonrpc":"2.0","id":2,"method":"session.hello","params":{"sid":"S-1-5-18"}}'
            ) -join "`n"
            $replies = ($requests + "`n") | & $exe bridge
            if ($LASTEXITCODE -ne 0) { throw "bridge failed" }
            Write-Host "replies:`n$($replies -join "`n")"
            if (($replies -join "`n") -notmatch '"id":1,"result":\{"known":false') { throw "hello reply missing" }
            if (($replies -join "`n") -notmatch '"id":2,"error":\{"code":-32602') { throw "identity in params was not refused" }
          } finally {
            Get-Content (Join-Path $data 'logs\server-agent.log') -ErrorAction SilentlyContinue | Select-Object -Last 20
            & $exe uninstall
          }
          if (Get-Service OffManualAgent -ErrorAction SilentlyContinue) { throw "service still installed" }

  desk:
    name: Desk (Rust, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desk/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build UI (tauri needs ../dist at compile time)
        run: pnpm --filter @offmanual/desk run build:ui
      - name: cargo fmt
        working-directory: apps/desk/src-tauri
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: apps/desk/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo test
        working-directory: apps/desk/src-tauri
        run: cargo test --locked
      - name: No Visual C++ runtime needed (static CRT, ADR-072)
        working-directory: apps/desk/src-tauri
        shell: pwsh
        run: |
          $target = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          # Newer Cargo puts test binaries under debug/build/<pkg>/<hash>/out, older under debug/deps.
          $exe = Get-ChildItem (Join-Path $target 'debug') -Recurse -Filter 'offmanual_desk-*.exe' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { throw 'test binary not found' }
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if ($text -match '(?i)vcruntime140\.dll') { throw "$($exe.Name) still imports VCRUNTIME140.dll" }
          Write-Host "$($exe.Name): no VCRUNTIME140.dll import"

  lab:
    name: Lab scripts parse (PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Parse every lab script with Windows PowerShell 5.1 and run PSScriptAnalyzer
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem lab -Recurse -Filter *.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $failed = $true; $errs | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" } }
          }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $findings = Invoke-ScriptAnalyzer -Path lab -Recurse -Severity Error
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { $failed = $true }
          if ($failed) { exit 1 }

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Findings fail the job and appear in the log; no SARIF artifact upload
          # (artifact storage quota on the account is limited).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  installer:
    name: Installer (WiX MSI, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/server-agent/go.mod
          cache-dependency-path: apps/server-agent/go.sum
      - name: Test payload (real Server Agent, placeholder Desk)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Join-Path $env:RUNNER_TEMP 'payload'
          New-Item -ItemType Directory -Force (Join-Path $p 'desk'), (Join-Path $p 'skills') | Out-Null
          go build -trimpath -o (Join-Path $p 'server-agent.exe') ./apps/server-agent/cmd/server-agent
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          Copy-Item (Join-Path $p 'server-agent.exe') (Join-Path $p 'desk\offmanual-desk.exe')
          Copy-Item skills/packs.json (Join-Path $p 'skills\packs.json')
          '{}' | Set-Content -Encoding utf8 (Join-Path $p 'manifest.json')
      - name: WiX 7 (OSMF EULA accepted on Dwahnil's instruction, ADR-071)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool install --global wix --version 7.0.1
          if ($LASTEXITCODE -ne 0) { throw 'wix install failed' }
          $tools = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content $env:GITHUB_PATH $tools
          & (Join-Path $tools 'wix.exe') eula accept wix7
          if ($LASTEXITCODE -ne 0) { throw 'eula accept failed' }
      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # A stand-in for the WebView2 installer: the runner already has WebView2, so setup must not run it.
          Copy-Item "$env:RUNNER_TEMP\payload\server-agent.exe" "$env:RUNNER_TEMP\wv2-standin.exe"
          wix build installer/OffManual.wxs -arch x64 -d Version=0.0.1 -d "PayloadDir=$env:RUNNER_TEMP\payload" -d "WebView2Installer=$env:RUNNER_TEMP\wv2-standin.exe" -o "$env:RUNNER_TEMP\OffManual-test.msi"
          if ($LASTEXITCODE -ne 0) { throw 'wix build failed' }
      - name: Install, check, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = "$env:RUNNER_TEMP\OffManual-test.msi"
          $root = Join-Path $env:ProgramFiles 'OffManual'
          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\install.log" -Tail 80; throw "install exit $($p.ExitCode)" }
          $cur = Get-Item (Join-Path $root 'current')
          if ($cur.LinkType -ne 'Junction' -or $cur.Target -notmatch 'versions\\0\.0\.1$') { throw "current: $($cur.LinkType) $($cur.Target)" }
          $svc = Get-CimInstance Win32_Service -Filter "Name='OffManualAgent'"
          if (-not $svc) { throw 'service not installed' }
          if ($svc.PathName -notmatch '\\current\\server-agent\.exe') { throw "service path $($svc.PathName)" }
          if ($svc.StartName -ne 'LocalSystem') { throw "service account $($svc.StartName)" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Service OffManualAgent).Status -ne 'Running' -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
          if ((Get-Service OffManualAgent).Status -ne 'Running') { throw 'service not running' }
          $flag = (sc.exe qfailureflag OffManualAgent) -join "`n"
          if ($flag -notmatch 'FAILURE_ACTIONS_ON_NONCRASH_FAILURES\s*:\s*TRUE') { throw "recovery flag: $flag" }
          $run = (Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').OffManualDesk
          if ($run -ne "`"$root\current\desk\offmanual-desk.exe`"") { throw "Run key: $run" }
          if (-not (Test-Path (Join-Path $root 'redist\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'))) { throw 'WebView2 installer not placed' }
          $verb = (Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\*\shell\OffManualDesk\command').'(default)'
          if ($verb -notmatch '--ask "%1"$') { throw "Explorer verb: $verb" }
          if (Select-String -Path "$env:RUNNER_TEMP\install.log" -Pattern 'ENROLCODE = ' -Quiet) { Write-Host 'note: ENROLCODE property appears in the log (empty here)' }
          # Uninstall: service, junction, registry and files gone; ProgramData kept.
          $u = Start-Process msiexec.exe -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\uninstall.log`"" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\uninstall.log" -Tail 80; throw "uninstall exit $($u.ExitCode)" }
          if (Get-Service OffManualAgent -ErrorAction SilentlyContinue) { throw 'service still installed' }
          if (Test-Path (Join-Path $root 'current')) { throw 'current still there' }
          if ((Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run').OffManualDesk) { throw 'Run key still there' }
          if (Test-Path 'Registry::HKEY_LOCAL_MACHINE\Software\Classes\*\shell\OffManualDesk') { throw 'Explorer verb still there' }
          if (Test-Path (Join-Path $root 'versions\0.0.1\server-agent.exe')) { throw 'files still there' }
          if (Test-Path (Join-Path $root 'redist\MicrosoftEdgeWebView2RuntimeInstallerX64.exe')) { throw 'WebView2 installer left behind' }
          Write-Host 'MSI install and uninstall verified.'

  python:
    name: Bundled Python (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Bundle pinned Python + openpyxl/pandas and smoke-test it (ADR-072)
        shell: pwsh
        run: |
          python tools/release/bundle_python.py --out "$env:RUNNER_TEMP\python" --smoke
          if ($LASTEXITCODE -ne 0) { throw 'bundled Python failed' }

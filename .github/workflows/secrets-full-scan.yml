name: Secret scan (full history)

# CI's push scan covers only the pushed commits. gitleaks-action v2 passes no
# --log-opts for workflow_dispatch and schedule events (src/gitleaks.js on the v2 tag),
# so with fetch-depth: 0 these runs scan every commit (security review item 9).
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 0" # Mondays 03:00 IST

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (all commits)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

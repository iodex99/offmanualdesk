[package]
name = "offmanual-desk"
version = "0.0.0"
description = "Off Manual Desk: per-employee assistant app for Indian CA firms"
edition = "2021"
rust-version = "1.85"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[lints.rust]
# deny (not forbid) so the one FFI module (agent_client::platform) can opt in with SAFETY comments.
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
